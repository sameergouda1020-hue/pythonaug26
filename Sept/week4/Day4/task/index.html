<!DOCTYPE html>
<html>
<head>
    <title>Student Registration</title>
</head>

<body>

<form id="studentForm">
    <h1 id="heading">Register</h1>

    <label for="name">Name :</label><br>
    <input id="name" type="text" placeholder="Enter your name"><br><br>

    <label for="email">Email :</label><br>
    <input id="email" type="email" placeholder="Enter your email"><br><br>

    <label for="phone">Phone :</label><br>
    <input id="phone" type="tel" placeholder="Enter your phone"><br><br>

    <label for="age">Age :</label><br>
    <input id="age" type="number" placeholder="Enter your age"><br><br>

    <label>Gender :</label><br>

    <input id="male" type="radio" name="gender" value="Male">
    <label for="male">Male</label>

    <input id="female" type="radio" name="gender" value="Female">
    <label for="female">Female</label>

    <br><br>

    <label for="course">Course :</label><br>
    <select id="course">
        <option value="">Select Course</option>
        <option>B.Tech</option>
        <option>BCA</option>
        <option>MCA</option>
        <option>MBA</option>
    </select>

    <br><br>

    <label for="password">Password :</label><br>
    <input id="password" type="password" placeholder="Enter password"><br><br>

    <label for="confirmPassword">Confirm Password :</label><br>
    <input id="confirmPassword" type="password" placeholder="Confirm password"><br><br>

    <button id="registerButton" type="button">Register</button>

   

</form>

<script src="script.js"></script>

</body>
</html>
